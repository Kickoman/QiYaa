name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_COMMIT: 6ade29bbd5a4c7e99439ec52adbc63c073953a57  # pinned: projectm 4.1.7

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Distro Qt (6.4 on Ubuntu 24.04): proves we build with the minimum version.
          - name: Linux (system Qt 6.4)
            os: ubuntu-24.04
            system_qt: true
          # Built on the oldest supported base so the AppImage runs on Ubuntu 22.04+ (glibc 2.35).
          - name: Linux (Qt 6.8, AppImage)
            os: ubuntu-22.04
            qt_arch: linux_gcc_64
          - name: Windows (Qt 6.8, MSVC)
            os: windows-2022
            qt_arch: win64_msvc2022_64
          - name: macOS (Qt 6.8, arm64)
            os: macos-14
            qt_arch: clang_64

    steps:
      - uses: actions/checkout@v4

      - name: Install system Qt
        if: matrix.system_qt
        run: |
          sudo apt-get update
          # dbus + gdbus: the MPRIS test talks to the app over a private session bus.
          sudo apt-get install -y qt6-base-dev libgl1-mesa-dev ninja-build dbus libglib2.0-bin

      - name: Install Qt 6.8
        if: ${{ !matrix.system_qt }}
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Linux build deps
        if: runner.os == 'Linux' && !matrix.system_qt
        run: |
          sudo apt-get update
          # g++-12: C++20 support; its libstdc++ is what Ubuntu 22.04 ships anyway.
          # libxcb-*: the xcb platform plugin's dependencies, bundled into the AppImage.
          # xvfb + mesa: the Milkdrop test renders with projectM on a virtual X server.
          sudo apt-get install -y ninja-build g++-12 libgl1-mesa-dev libgl1-mesa-dri xvfb dbus libglib2.0-bin \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-xkb1
          echo "CC=gcc-12" >> "$GITHUB_ENV"
          echo "CXX=g++-12" >> "$GITHUB_ENV"

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      # projectM (Milkdrop) on Windows needs GLEW; vcpkg builds both. Elsewhere
      # CMake downloads and builds projectM itself.
      - name: Cache vcpkg packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-projectm-${{ env.VCPKG_COMMIT }}

      - name: projectM via vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-cache
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          root=$(cygpath -m "$RUNNER_TEMP/vcpkg")
          git init -q "$root"
          git -C "$root" fetch -q --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_COMMIT"
          git -C "$root" checkout -q FETCH_HEAD
          cmd //c "$(cygpath -w "$root/bootstrap-vcpkg.bat")" -disableMetrics
          "$root/vcpkg.exe" install projectm:x64-windows-release
          echo "CMAKE_EXTRA=-DCMAKE_TOOLCHAIN_FILE=$root/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-release" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          GEN="-G Ninja"
          [ "$RUNNER_OS" = "macOS" ] && GEN=""
          # The Qt 6.8 builds must have Milkdrop; the minimum-Qt build checks building without it.
          if [ "${{ matrix.system_qt }}" = "true" ]; then MILKDROP="-DQIYAA_WITH_MILKDROP=OFF"; else MILKDROP="-DQIYAA_REQUIRE_MILKDROP=ON"; fi
          cmake -S . -B build $GEN -DCMAKE_BUILD_TYPE=Release $MILKDROP $CMAKE_EXTRA
          echo "VERSION=$(cat build/version.txt)" >> "$GITHUB_ENV"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Screenshot (offscreen)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          case "$RUNNER_OS" in
            Windows) BIN=build/QiYaa.exe ;;
            macOS)   BIN=build/QiYaa.app/Contents/MacOS/QiYaa ;;
            *)       BIN=build/QiYaa ;;
          esac
          "$BIN" --screenshot screenshot.png --offline

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux' && !matrix.system_qt
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1   # no FUSE needed on the runner
          EXTRA_PLATFORM_PLUGINS: libqoffscreen.so  # for --screenshot (and the check below)
        run: |
          DESTDIR="$PWD/AppDir" cmake --install build --prefix /usr
          base=https://github.com/linuxdeploy
          curl -sSLf -o linuxdeploy "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -sSLf -o linuxdeploy-plugin-qt "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          mv linuxdeploy-plugin-qt linuxdeploy-plugin-qt-x86_64.AppImage
          export QMAKE="$QT_ROOT_DIR/bin/qmake" LD_LIBRARY_PATH="$QT_ROOT_DIR/lib" LINUXDEPLOY_OUTPUT_VERSION="$VERSION"
          ./linuxdeploy --appdir AppDir --desktop-file AppDir/usr/share/applications/qiyaa.desktop \
            --icon-file resources/icons/qiyaa-256.png --icon-filename qiyaa --plugin qt --output appimage
          mkdir -p dist && mv QiYaa-*.AppImage dist/
          # The AppImage must start on its own (not with the runner's Qt).
          env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH QT_QPA_PLATFORM=offscreen \
            dist/QiYaa-*.AppImage --screenshot appimage.png --offline

      - name: Package (Windows folder + zip)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist/QiYaa
          cp build/QiYaa.exe dist/QiYaa/
          cp build/*.dll dist/QiYaa/  # projectM and GLEW, copied next to the exe by vcpkg
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw --no-compiler-runtime dist/QiYaa/QiYaa.exe
          # App-local MSVC runtime: runs without installing the VC++ redistributable.
          cp "$(cygpath -u "$VCToolsRedistDir")"/x64/Microsoft.VC14*.CRT/*.dll dist/QiYaa/
          cp LICENSE THIRD_PARTY.md dist/QiYaa/
          (cd dist && 7z a -bd "QiYaa-$VERSION-windows-x64.zip" QiYaa > /dev/null)

      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Inno Setup >= 6.3 (x64compatible); installs it if the runner image lacks it.
          choco upgrade innosetup -y --no-progress | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /Q "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\dist\QiYaa" "/DOutputDir=$PWD\dist" packaging\windows\qiyaa.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Recurse dist\QiYaa

      - name: Package (macOS dmg)
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/QiYaa.app -dmg
          mkdir -p dist && mv build/QiYaa.dmg "dist/QiYaa-$VERSION-macos-arm64.dmg"

      - uses: actions/upload-artifact@v4
        if: ${{ !matrix.system_qt }}
        with:
          name: QiYaa-${{ runner.os }}
          path: |
            dist/
            screenshot.png
          if-no-files-found: error

  # Pushing a tag like v0.2.0 publishes the packages as a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*/dist/*.AppImage
            artifacts/*/dist/*.zip
            artifacts/*/dist/*-setup.exe
            artifacts/*/dist/*.dmg
